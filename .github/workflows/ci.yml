name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Validate deployment files
        run: make validate
      - name: Validate Compose model
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Build production images
        run: docker compose build
      - name: Validate Compose services
        run: docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v5
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password-123/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=development/' .env
      - name: Start Compose
        run: docker compose up -d --build
      - name: Wait for HTTP health
        run: |
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1/health && exit 0; sleep 2; done
          docker compose ps
          docker compose logs --no-color api nginx
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: tests/e2e
        run: npm test
      - name: Stop Compose
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Audit Go dependencies
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
