name: registrypulse

x-app-image: &app-image "${REGISTRYPULSE_IMAGE:-ouoocode/registrypulse}:${REGISTRYPULSE_VERSION:-latest}"
x-app-build: &app-build
  context: .
  args:
    BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
    GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registry_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-registry_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  api:
    image: *app-image
    build: *app-build
    restart: unless-stopped
    user: app
    entrypoint: ["/api"]
    env_file: [.env]
    environment:
      API_HTTP_PORT: "${API_HTTP_PORT:-8080}"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    expose: ["${API_HTTP_PORT:-8080}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${API_HTTP_PORT}/health/live"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks: [backend]
    logging: *default-logging
  worker:
    image: *app-image
    build: *app-build
    restart: unless-stopped
    user: app
    entrypoint: ["/worker"]
    env_file: [.env]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "kill -0 1"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  proxy:
    image: *app-image
    build: *app-build
    restart: unless-stopped
    user: app
    entrypoint: ["/registry-proxy"]
    env_file: [.env]
    environment:
      PROXY_HTTP_PORT: "10800"
      PROXY_REDIS_URL: "${PROXY_REDIS_URL:-redis://redis:6379/0}"
      PROXY_CATEGORY_ID: "${PROXY_CATEGORY_ID:-dockerhub}"
      PROXY_UPSTREAMS: "${PROXY_UPSTREAMS:-}"
    depends_on: {redis: {condition: service_healthy}}
    ports: ["10800:10800"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PROXY_HTTP_PORT}/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging
  frontend:
    image: *app-image
    build: *app-build
    restart: unless-stopped
    environment:
      REGISTRYPULSE_MODE: frontend
    expose: ["80"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"], interval: 10s, timeout: 5s, retries: 5}
    networks: [frontend, backend]
    logging: *default-logging
  nginx:
    image: *app-image
    restart: unless-stopped
    environment:
      REGISTRYPULSE_MODE: edge
      API_HTTP_PORT: "${API_HTTP_PORT:-8080}"
    depends_on: {api: {condition: service_healthy}, frontend: {condition: service_started}}
    ports: ["${HTTP_PORT:-80}:80"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"], interval: 10s, timeout: 5s, retries: 5}
    networks: [frontend, backend]
    logging: *default-logging
networks:
  frontend: {}
  backend: {}
volumes:
  postgres-data:
    name: registrypulse_postgres-data
  redis-data:
    name: registrypulse_redis-data
