name: registrypulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registry_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-registry_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  api:
    build:
      context: ./backend
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    env_file: [.env]
    environment:
      HTTP_PORT: "8080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    expose: ["8080"]
    healthcheck: {test: ["CMD", "/bin/sh", "-c", "wget -q -O - http://127.0.0.1:8080/health/live"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  worker:
    build:
      context: ./backend
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    entrypoint: ["/worker"]
    env_file: [.env]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "kill -0 1"], interval: 10s, timeout: 5s, retries: 5}
    networks: [backend]
    logging: *default-logging
  frontend:
    build:
      context: ./frontend
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
    restart: unless-stopped
    expose: ["80"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"], interval: 10s, timeout: 5s, retries: 5}
    networks: [frontend, backend]
    logging: *default-logging
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}, frontend: {condition: service_started}}
    ports: ["80:80"]
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"], interval: 10s, timeout: 5s, retries: 5}
    networks: [frontend, backend]
    logging: *default-logging
networks:
  frontend: {}
  backend: {}
volumes:
  postgres-data:
    name: registrypulse_postgres-data
  redis-data:
    name: registrypulse_redis-data
