server {
  listen 80;
  server_name _;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:__API_HTTP_PORT__;
  set $frontend_upstream frontend:80;

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /health {
    proxy_pass http://$api_upstream/health/live;
    proxy_set_header Host $host;
    access_log off;
  }

  location /health/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    access_log off;
  }

  location = /metrics {
    proxy_pass http://$api_upstream/metrics;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
